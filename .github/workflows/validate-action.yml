name: Validate STM32 CMake Action

on:
  pull_request:
    paths:
      - 'entrypoint.sh'
      - 'parse-cmake-args.sh'
      - 'action.yml'
      - 'Dockerfile'
      - '.github/workflows/validate-action.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [traditional, custom-preset, quoted-args]
    steps:
      - uses: actions/checkout@v6
      - name: Create minimal ARM CMake fixture
        run: |
          mkdir -p ci-fixture
          cat > ci-fixture/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22)
          set(CMAKE_C_COMPILER arm-none-eabi-gcc)
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          project(ci_firmware LANGUAGES C)
          add_library(firmware STATIC main.c)
          if(DEFINED TEST_MESSAGE AND NOT TEST_MESSAGE STREQUAL "hello world")
            message(FATAL_ERROR "Quoted argument was split: ${TEST_MESSAGE}")
          endif()
          EOF
          echo 'int main(void) { return 0; }' > ci-fixture/main.c
          cat > ci-fixture/CMakePresets.json <<'EOF'
          {
            "version": 3,
            "configurePresets": [{
              "name": "Custom",
              "generator": "Unix Makefiles",
              "binaryDir": "${sourceDir}/out/nonstandard",
              "cacheVariables": {"CMAKE_BUILD_TYPE": "Debug"}
            }]
          }
          EOF
      - name: Build traditional
        if: matrix.mode == 'traditional'
        uses: ./
        with:
          project-path: ci-fixture
          build-config: Debug
          build-target: firmware
      - name: Build preset with custom binaryDir
        if: matrix.mode == 'custom-preset'
        uses: ./
        with:
          project-path: ci-fixture
          build-config: Debug
          build-target: firmware
          cmake-args: '--preset Custom'
      - name: Build with quoted arguments
        if: matrix.mode == 'quoted-args'
        uses: ./
        with:
          project-path: ci-fixture
          build-config: Debug
          build-target: firmware
          cmake-args: '-DTEST_MESSAGE="hello world"'
      - name: Assert build output
        run: |
          if [ "${{ matrix.mode }}" != "custom-preset" ]; then
            test -s ci-fixture/build/libfirmware.a
            test -f ci-fixture/build/build.ninja
          else
            test -s ci-fixture/out/nonstandard/libfirmware.a
            test -f ci-fixture/out/nonstandard/Makefile
          fi
