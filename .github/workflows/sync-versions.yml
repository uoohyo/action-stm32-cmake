name: Sync STM32CubeCLT Versions

on:
  # Docker documentation updates do not directly dispatch this workflow.
  schedule:
    - cron: '33 4 * * 0'
  push:
    branches: [main]
  repository_dispatch:
    types: [new-stm32cubeclt-version]
  workflow_dispatch:

concurrency:
  group: sync-toolchain-versions
  cancel-in-progress: false

jobs:
  sync-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - name: Fetch confirmed available versions
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/uoohyo/docker-stm32-cmake/main/docs/versions.md \
            --output /tmp/versions.md
      - name: Reconcile tags, releases, and aliases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          python3 .github/scripts/sync_versions.py --kind stm32 --versions-file /tmp/versions.md
      - name: Preserve reconciliation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-sync-results
          path: sync-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Update README badge
        run: |
          VERSIONS=$(python3 -c "import sys; sys.path.insert(0, '.github/scripts'); from sync_versions import available_versions; print('\n'.join(available_versions(open('/tmp/versions.md').read(), 3)))")
          # Get oldest and newest versions
          OLDEST=$(echo "$VERSIONS" | head -1)
          NEWEST=$(echo "$VERSIONS" | tail -1)

          # Extract major.minor versions
          OLDEST_SHORT=$(echo "$OLDEST" | grep -oE '^[0-9]+\.[0-9]+')
          NEWEST_SHORT=$(echo "$NEWEST" | grep -oE '^[0-9]+\.[0-9]+')

          # Update README badge
          sed -i "s/STM32CubeCLT-v[0-9.]*--v[0-9.]*/STM32CubeCLT-v${OLDEST_SHORT}--v${NEWEST_SHORT}/g" README.md

          # Commit if changed
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "📝 docs: auto-update STM32CubeCLT version badge to v${OLDEST_SHORT}--v${NEWEST_SHORT}"
            git push origin main
            echo "✅ README badge updated"
          else
            echo "ℹ️ README badge already up to date"
          fi
